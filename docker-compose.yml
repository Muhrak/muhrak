# Local development only. Production uses managed Postgres and Redis.
services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: muhrak
      POSTGRES_PASSWORD: muhrak
      POSTGRES_DB: muhrak
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
